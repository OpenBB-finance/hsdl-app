worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    proxy_cache_path /dev/shm/cache levels=1:2
                     keys_zone=hsdl_cache:10m
                     max_size=512m
                     inactive=7d
                     use_temp_path=off;

    map $args $cache_args {
        "~^(.+)&\\$\\$app_token=[^&]+$"           "$1";
        "~^\\$\\$app_token=[^&]+&(.+)$"            "$1";
        "~^(.+)&\\$\\$app_token=[^&]+&(.+)$"      "$1&$2";
        "~^\\$\\$app_token=[^&]+$"                  "";
        default                                     $args;
    }

    map $http_origin $cors_origin {
        "http://localhost:1420"    $http_origin;
        "https://pro.openbb.dev"  $http_origin;
        "https://pro.openbb.co"   $http_origin;
        default                   "";
    }

    server {
        listen 80;

        set $backend http://api:7780;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /health {
            proxy_pass $backend;
        }

        location / {
            proxy_cache hsdl_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_key "$request_method$uri$cache_args";
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_pass $backend;
        }
    }
}
