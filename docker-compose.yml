services:
  api:
    build: .
    command: serve
    environment:
      HSDL_DB_PATH: /app/data/hsdl_catalog.db
      HSDL_DATA_DIR: /app/data
    volumes:
      - hsdl_data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./hsdl-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  hsdl_data:
